name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Fast gate: catches schema/case drift before spending time on a 33.7 MB download.
      - name: Validate the tool schema and case suite
        run: node tools/validate-schema.mjs

      # 33.7 MB of weights plus two engine binaries. Cached so most runs skip the download.
      - name: Cache Needle 3 engine and weights
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: needle3-models-v1

      - name: Fetch Needle 3 (android engine, linux engine, weights)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-models.mjs --platform android-arm64,linux-x86_64

      # Re-stage the Android engine even on a cache hit, because jniLibs is gitignored.
      - name: Stage the Android engine into jniLibs
        run: node scripts/fetch-models.mjs --platform android-arm64

      # Runs the frozen routing suite against the real model. This is the gate that says
      # the tool schema still works, not merely that it parses.
      - name: Tool-routing suite (real Needle 3)
        id: cases
        continue-on-error: true
        run: node tools/run-cases.mjs

      - name: Sync Capacitor web assets into the Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build the debug APK (signed with the debug key — installable)
        run: cd android && ./gradlew assembleDebug

      - name: Report APK size
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "### APK built" >> $GITHUB_STEP_SUMMARY
          du -h android/app/build/outputs/apk/debug/app-debug.apk >> $GITHUB_STEP_SUMMARY

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: voice-command-center-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The APK is uploaded first on purpose: a red run still gives you something to
      # install and test on the phone while the tool schema is being tuned.
      - name: Fail the run if the routing suite failed
        if: steps.cases.outcome == 'failure'
        run: |
          echo "::error::The tool-routing suite failed. The APK was still built and uploaded for on-device testing."
          exit 1
