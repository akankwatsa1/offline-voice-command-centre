apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.voicecmd.center"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.voicecmd.center"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // The Needle 3 engine is an arm64-v8a binary. Shipping only that ABI keeps the
        // APK from carrying an engine no device in scope can execute.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    // The engine is launched as a child process, and Android only lets an app execute a
    // file that exists on a real filesystem with the executable bit set. That is the
    // native library directory, so useLegacyPackaging must stay on: with it off, AGP
    // leaves native code inside the APK and there is nothing on disk to exec.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    androidResources {
        // needle3.cact is already dense binary data. Storing it uncompressed avoids a
        // decompress pass on first run and keeps first-launch setup snappy.
        noCompress 'cact'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Keep one copy of the tool schema: shared/tools.json is what the CI case runner and the
// engine both read, so the app cannot drift from the tested schema.
tasks.register('stageSharedAssets', Copy) {
    from "${rootProject.projectDir}/../shared/tools.json"
    into "${projectDir}/src/main/assets"
}
tasks.named('preBuild') {
    dependsOn 'stageSharedAssets'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
